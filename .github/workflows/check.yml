name: check

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Node / Tauri
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # -------------------------
      # Rust
      # -------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # -------------------------
      # Linux Tauri and Fcitx5 GTK3 deps
      # -------------------------
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y \
            fcitx5-frontend-gtk3 \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build AppImage
        run: npm run tauri -- build --bundles appimage

      - name: Verify the AppImage contains the Fcitx5 GTK3 module
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mkdir -p "$RUNNER_TEMP/appimage-check"
          (
            cd "$RUNNER_TEMP/appimage-check"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          appdir="$RUNNER_TEMP/appimage-check/squashfs-root"
          module="$(find "$appdir/usr/lib" -name im-fcitx5.so -print -quit)"
          cache="$(find "$appdir/usr/lib" -path '*/gtk-3.0/3.0.0/immodules.cache' -print -quit)"
          test -n "$module"
          test -n "$cache"
          grep -q 'im-fcitx5.so' "$cache"

      - name: Upload Linux AppImage for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: Bili-Live-Hime-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
